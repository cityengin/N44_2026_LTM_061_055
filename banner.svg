<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#060913"/>
      <stop offset="50%" stop-color="#0b1329"/>
      <stop offset="100%" stop-color="#070c18"/>
    </linearGradient>
    
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="45%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>

    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>

    <linearGradient id="cardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#1e293b" stop-opacity="0.6"/>
    </linearGradient>

    <linearGradient id="hotLinkGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="50%" stop-color="#f43f5e"/>
      <stop offset="100%" stop-color="#fb7185"/>
    </linearGradient>

    <linearGradient id="coolLinkGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0.4"/>
    </linearGradient>

    <!-- Glow Filters -->
    <filter id="glowCyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="glowHot" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="7" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.7" stroke-opacity="0.5"/>
      <circle cx="40" cy="40" r="1" fill="#38bdf8" fill-opacity="0.25"/>
    </pattern>
  </defs>

  <style>
    .font-sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif; }
    .font-mono { font-family: 'SF Mono', Consolas, 'Liberation Mono', Menlo, Courier, monospace; }
  </style>

  <!-- Deep Base Background -->
  <rect width="1200" height="420" fill="url(#bgGrad)"/>
  <rect width="1200" height="420" fill="url(#grid)"/>

  <!-- Ambient Light Orbs -->
  <circle cx="200" cy="80" r="180" fill="#0284c7" fill-opacity="0.12" filter="url(#glowCyan)"/>
  <circle cx="950" cy="220" r="220" fill="#6366f1" fill-opacity="0.12" filter="url(#glowCyan)"/>
  <circle cx="890" cy="180" r="100" fill="#f43f5e" fill-opacity="0.1" filter="url(#glowHot)"/>

  <!-- Outer Border Frame -->
  <rect x="1" y="1" width="1198" height="418" rx="14" fill="none" stroke="#334155" stroke-width="1.2" stroke-opacity="0.5"/>

  <!-- ================= LEFT COLUMN: HERO CONTENT ================= -->
  
  <!-- Pill Badge: Framework -->
  <g transform="translate(60, 42)">
    <rect x="0" y="0" width="310" height="28" rx="14" fill="#0f172a" stroke="#0284c7" stroke-width="1" stroke-opacity="0.7"/>
    <circle cx="14" cy="14" r="4.5" fill="#38bdf8" filter="url(#subtleGlow)"/>
    <text x="28" y="18" fill="#bae6fd" class="font-mono" font-size="11.5" font-weight="600" letter-spacing="0.5">NS-3.48 · C++23 SIMULATION PLATFORM</text>
  </g>

  <!-- Main Title -->
  <text x="60" y="118" class="font-sans" font-size="44" font-weight="800" fill="url(#titleGrad)" letter-spacing="-0.5">NoC Routing Pressure</text>

  <!-- Subtitle -->
  <text x="60" y="152" class="font-sans" font-size="16.5" font-weight="600" fill="#e2e8f0" letter-spacing="0.2">A Channel-Related &amp; Traffic-Aware Metric for Network-on-Chip</text>
  
  <!-- Paper citation & context -->
  <text x="60" y="182" class="font-sans" font-size="13.5" fill="#94a3b8">
    Tái hiện &amp; kiểm chứng nghiên cứu <tspan fill="#38bdf8" font-weight="600">Tang, Lin, Palesi (IEEE TPDS 2015)</tspan> trên lưới 2D Mesh 7×7
  </text>
  <text x="60" y="204" class="font-sans" font-size="13" fill="#64748b">
    Mô hình hóa áp lực kênh (ρ), áp lực định tuyến (φ), ngưỡng bão hòa PIR<tspan font-size="10" dy="2">max</tspan><tspan font-size="13" dy="-2"> và độ trễ gãy hàng đợi.</tspan>
  </text>

  <!-- Feature Badges (Pills) -->
  <g transform="translate(60, 235)">
    <!-- Badge 1: 2D Mesh -->
    <g transform="translate(0, 0)">
      <rect width="135" height="26" rx="6" fill="#1e293b" fill-opacity="0.8" stroke="#38bdf8" stroke-width="0.8" stroke-opacity="0.4"/>
      <text x="10" y="17" fill="#38bdf8" class="font-sans" font-size="11.5" font-weight="600">⊞ 2D Mesh (7×7)</text>
    </g>

    <!-- Badge 2: Minimal Routing -->
    <g transform="translate(145, 0)">
      <rect width="180" height="26" rx="6" fill="#1e293b" fill-opacity="0.8" stroke="#818cf8" stroke-width="0.8" stroke-opacity="0.4"/>
      <text x="10" y="17" fill="#a5b4fc" class="font-sans" font-size="11.5" font-weight="600">🔀 XY · YX · NF · OE</text>
    </g>

    <!-- Badge 3: Deadlock Free -->
    <g transform="translate(335, 0)">
      <rect width="185" height="26" rx="6" fill="#1e293b" fill-opacity="0.8" stroke="#34d399" stroke-width="0.8" stroke-opacity="0.4"/>
      <text x="10" y="17" fill="#6ee7b7" class="font-sans" font-size="11.5" font-weight="600">🛡️ CDG Deadlock-Free</text>
    </g>

    <!-- Badge 4: Hop vs Path -->
    <g transform="translate(0, 36)">
      <rect width="170" height="26" rx="6" fill="#1e293b" fill-opacity="0.8" stroke="#f59e0b" stroke-width="0.8" stroke-opacity="0.4"/>
      <text x="10" y="17" fill="#fcd34d" class="font-sans" font-size="11.5" font-weight="600">⚖️ Hop vs Path Verified</text>
    </g>

    <!-- Badge 5: Queueing Model -->
    <g transform="translate(180, 36)">
      <rect width="185" height="26" rx="6" fill="#1e293b" fill-opacity="0.8" stroke="#ec4899" stroke-width="0.8" stroke-opacity="0.4"/>
      <text x="10" y="17" fill="#f472b6" class="font-sans" font-size="11.5" font-weight="600">📈 Kleinrock SC Model</text>
    </g>

    <!-- Badge 6: Reproducible -->
    <g transform="translate(375, 36)">
      <rect width="145" height="26" rx="6" fill="#1e293b" fill-opacity="0.8" stroke="#0284c7" stroke-width="0.8" stroke-opacity="0.4"/>
      <text x="10" y="17" fill="#7dd3fc" class="font-sans" font-size="11.5" font-weight="600">🎯 100% Byte-Match</text>
    </g>
  </g>

  <!-- Metric / Formula Callout Box -->
  <g transform="translate(60, 324)">
    <rect width="520" height="52" rx="8" fill="#0f172a" fill-opacity="0.9" stroke="#334155" stroke-width="1"/>
    
    <!-- Item 1: Routing Pressure -->
    <text x="20" y="22" class="font-mono" font-size="10" fill="#94a3b8" letter-spacing="0.5">ROUTING PRESSURE</text>
    <text x="20" y="41" class="font-mono" font-size="14" font-weight="700" fill="#38bdf8">φ = max ρ(c)</text>

    <!-- Divider 1 -->
    <line x1="165" y1="12" x2="165" y2="42" stroke="#334155" stroke-width="1"/>

    <!-- Item 2: Max PIR -->
    <text x="185" y="22" class="font-mono" font-size="10" fill="#94a3b8" letter-spacing="0.5">SATURATION THRESHOLD</text>
    <text x="185" y="41" class="font-mono" font-size="14" font-weight="700" fill="#f59e0b">PIR<tspan font-size="10" dy="1">max</tspan><tspan font-size="14" dy="-1"> = 0.0625 / φ</tspan></text>

    <!-- Divider 2 -->
    <line x1="375" y1="12" x2="375" y2="42" stroke="#334155" stroke-width="1"/>

    <!-- Item 3: Correlation -->
    <text x="395" y="22" class="font-mono" font-size="10" fill="#94a3b8" letter-spacing="0.5">EMPIRICAL ACCURACY</text>
    <text x="395" y="41" class="font-mono" font-size="14" font-weight="700" fill="#34d399">R² = 0.99986</text>
  </g>

  <!-- ================= RIGHT COLUMN: INTERACTIVE NOC MESH DIAGRAM ================= -->
  
  <g transform="translate(640, 25)">
    <!-- Container Card -->
    <rect width="500" height="370" rx="14" fill="url(#cardBg)" stroke="#38bdf8" stroke-width="1.2" stroke-opacity="0.3"/>
    
    <!-- Card Header Bar -->
    <rect width="500" height="34" rx="14" fill="#0f172a" fill-opacity="0.9"/>
    <rect y="20" width="500" height="14" fill="#0f172a" fill-opacity="0.9"/>
    <circle cx="20" cy="17" r="4.5" fill="#ef4444"/>
    <circle cx="36" cy="17" r="4.5" fill="#f59e0b"/>
    <circle cx="52" cy="17" r="4.5" fill="#10b981"/>
    
    <text x="75" y="21" class="font-mono" font-size="11.5" fill="#94a3b8">2D Mesh Router Fabric (Hop-by-Hop Pressure &amp; Routing)</text>

    <!-- 4x4 Grid of Router Nodes & Channels -->
    <!-- Offsets: x0 = 80, y0 = 70; dx = 110, dy = 72 -->
    <g transform="translate(35, 45)">
      
      <!-- Normal Channels (Horizontal) -->
      <!-- Row 0 -->
      <line x1="45" y1="36" x2="155" y2="36" stroke="url(#coolLinkGrad)" stroke-width="2.5"/>
      <line x1="155" y1="36" x2="265" y2="36" stroke="url(#coolLinkGrad)" stroke-width="2.5"/>
      <line x1="265" y1="36" x2="375" y2="36" stroke="url(#coolLinkGrad)" stroke-width="2.5"/>
      
      <!-- Row 1 -->
      <line x1="45" y1="108" x2="155" y2="108" stroke="url(#coolLinkGrad)" stroke-width="2.5"/>
      <!-- Bottleneck Hot Link! High Pressure: 1-1 -> 2-1 -->
      <line x1="155" y1="108" x2="265" y2="108" stroke="url(#hotLinkGrad)" stroke-width="5" filter="url(#glowHot)"/>
      <line x1="265" y1="108" x2="375" y2="108" stroke="url(#coolLinkGrad)" stroke-width="2.5"/>

      <!-- Row 2 -->
      <line x1="45" y1="180" x2="155" y2="180" stroke="url(#coolLinkGrad)" stroke-width="2.5"/>
      <line x1="155" y1="180" x2="265" y2="180" stroke="#f59e0b" stroke-width="3" stroke-dasharray="4 3"/>
      <line x1="265" y1="180" x2="375" y2="180" stroke="url(#coolLinkGrad)" stroke-width="2.5"/>

      <!-- Row 3 -->
      <line x1="45" y1="252" x2="155" y2="252" stroke="url(#coolLinkGrad)" stroke-width="2.5"/>
      <line x1="155" y1="252" x2="265" y2="252" stroke="url(#coolLinkGrad)" stroke-width="2.5"/>
      <line x1="265" y1="252" x2="375" y2="252" stroke="url(#coolLinkGrad)" stroke-width="2.5"/>

      <!-- Normal Channels (Vertical) -->
      <!-- Col 0 -->
      <line x1="45" y1="36" x2="45" y2="108" stroke="url(#coolLinkGrad)" stroke-width="2.5"/>
      <line x1="45" y1="108" x2="45" y2="180" stroke="url(#coolLinkGrad)" stroke-width="2.5"/>
      <line x1="45" y1="180" x2="45" y2="252" stroke="url(#coolLinkGrad)" stroke-width="2.5"/>

      <!-- Col 1 -->
      <line x1="155" y1="36" x2="155" y2="108" stroke="#38bdf8" stroke-width="3.5" filter="url(#subtleGlow)"/>
      <line x1="155" y1="108" x2="155" y2="180" stroke="#f59e0b" stroke-width="3" stroke-dasharray="4 3"/>
      <line x1="155" y1="180" x2="155" y2="252" stroke="url(#coolLinkGrad)" stroke-width="2.5"/>

      <!-- Col 2 -->
      <line x1="265" y1="36" x2="265" y2="108" stroke="url(#coolLinkGrad)" stroke-width="2.5"/>
      <!-- Bottleneck Hot Link! Downward channel -->
      <line x1="265" y1="108" x2="265" y2="180" stroke="url(#hotLinkGrad)" stroke-width="5" filter="url(#glowHot)"/>
      <line x1="265" y1="180" x2="265" y2="252" stroke="url(#coolLinkGrad)" stroke-width="2.5"/>

      <!-- Col 3 -->
      <line x1="375" y1="36" x2="375" y2="108" stroke="url(#coolLinkGrad)" stroke-width="2.5"/>
      <line x1="375" y1="108" x2="375" y2="180" stroke="url(#coolLinkGrad)" stroke-width="2.5"/>
      <line x1="375" y1="180" x2="375" y2="252" stroke="url(#coolLinkGrad)" stroke-width="2.5"/>

      <!-- Moving Flit Packets (Animated Visual Look) -->
      <circle cx="100" cy="36" r="3.5" fill="#38bdf8" filter="url(#subtleGlow)"/>
      <circle cx="210" cy="108" r="4.5" fill="#f43f5e" filter="url(#glowHot)"/>
      <circle cx="265" cy="144" r="4.5" fill="#f43f5e" filter="url(#glowHot)"/>
      <circle cx="205" cy="180" r="3.5" fill="#f59e0b"/>
      <circle cx="155" cy="72" r="3.5" fill="#38bdf8"/>
      <circle cx="320" cy="108" r="3.5" fill="#818cf8"/>

      <!-- 16 Router Nodes (4x4) -->
      <!-- Macro to draw nodes: x, y, label, isHot, isSource, isDest -->
      
      <!-- Row 0 -->
      <!-- R0 (Source) -->
      <g transform="translate(29, 20)">
        <rect width="32" height="32" rx="7" fill="#0284c7" stroke="#38bdf8" stroke-width="1.8" filter="url(#subtleGlow)"/>
        <text x="16" y="20" class="font-mono" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">SRC</text>
      </g>
      <g transform="translate(139, 20)">
        <rect width="32" height="32" rx="7" fill="#1e293b" stroke="#475569" stroke-width="1.2"/>
        <text x="16" y="20" class="font-mono" font-size="10.5" fill="#94a3b8" text-anchor="middle">R1</text>
      </g>
      <g transform="translate(249, 20)">
        <rect width="32" height="32" rx="7" fill="#1e293b" stroke="#475569" stroke-width="1.2"/>
        <text x="16" y="20" class="font-mono" font-size="10.5" fill="#94a3b8" text-anchor="middle">R2</text>
      </g>
      <g transform="translate(359, 20)">
        <rect width="32" height="32" rx="7" fill="#1e293b" stroke="#475569" stroke-width="1.2"/>
        <text x="16" y="20" class="font-mono" font-size="10.5" fill="#94a3b8" text-anchor="middle">R3</text>
      </g>

      <!-- Row 1 -->
      <g transform="translate(29, 92)">
        <rect width="32" height="32" rx="7" fill="#1e293b" stroke="#475569" stroke-width="1.2"/>
        <text x="16" y="20" class="font-mono" font-size="10.5" fill="#94a3b8" text-anchor="middle">R4</text>
      </g>
      <!-- Intermediate routing branch point -->
      <g transform="translate(139, 92)">
        <rect width="32" height="32" rx="7" fill="#1e1b4b" stroke="#818cf8" stroke-width="1.8"/>
        <text x="16" y="20" class="font-mono" font-size="10.5" font-weight="700" fill="#c7d2fe" text-anchor="middle">R5</text>
      </g>
      <!-- Bottleneck Router Node -->
      <g transform="translate(249, 92)">
        <rect width="32" height="32" rx="7" fill="#881337" stroke="#f43f5e" stroke-width="2" filter="url(#glowHot)"/>
        <text x="16" y="20" class="font-mono" font-size="10.5" font-weight="800" fill="#ffe4e6" text-anchor="middle">R6</text>
      </g>
      <g transform="translate(359, 92)">
        <rect width="32" height="32" rx="7" fill="#1e293b" stroke="#475569" stroke-width="1.2"/>
        <text x="16" y="20" class="font-mono" font-size="10.5" fill="#94a3b8" text-anchor="middle">R7</text>
      </g>

      <!-- Row 2 -->
      <g transform="translate(29, 164)">
        <rect width="32" height="32" rx="7" fill="#1e293b" stroke="#475569" stroke-width="1.2"/>
        <text x="16" y="20" class="font-mono" font-size="10.5" fill="#94a3b8" text-anchor="middle">R8</text>
      </g>
      <g transform="translate(139, 164)">
        <rect width="32" height="32" rx="7" fill="#1e293b" stroke="#475569" stroke-width="1.2"/>
        <text x="16" y="20" class="font-mono" font-size="10.5" fill="#94a3b8" text-anchor="middle">R9</text>
      </g>
      <!-- Destination Node -->
      <g transform="translate(249, 164)">
        <rect width="32" height="32" rx="7" fill="#065f46" stroke="#34d399" stroke-width="2" filter="url(#subtleGlow)"/>
        <text x="16" y="20" class="font-mono" font-size="11" font-weight="800" fill="#a7f3d0" text-anchor="middle">DST</text>
      </g>
      <g transform="translate(359, 164)">
        <rect width="32" height="32" rx="7" fill="#1e293b" stroke="#475569" stroke-width="1.2"/>
        <text x="16" y="20" class="font-mono" font-size="10.5" fill="#94a3b8" text-anchor="middle">R11</text>
      </g>

      <!-- Row 3 -->
      <g transform="translate(29, 236)">
        <rect width="32" height="32" rx="7" fill="#1e293b" stroke="#475569" stroke-width="1.2"/>
        <text x="16" y="20" class="font-mono" font-size="10.5" fill="#94a3b8" text-anchor="middle">R12</text>
      </g>
      <g transform="translate(139, 236)">
        <rect width="32" height="32" rx="7" fill="#1e293b" stroke="#475569" stroke-width="1.2"/>
        <text x="16" y="20" class="font-mono" font-size="10.5" fill="#94a3b8" text-anchor="middle">R13</text>
      </g>
      <g transform="translate(249, 236)">
        <rect width="32" height="32" rx="7" fill="#1e293b" stroke="#475569" stroke-width="1.2"/>
        <text x="16" y="20" class="font-mono" font-size="10.5" fill="#94a3b8" text-anchor="middle">R14</text>
      </g>
      <g transform="translate(359, 236)">
        <rect width="32" height="32" rx="7" fill="#1e293b" stroke="#475569" stroke-width="1.2"/>
        <text x="16" y="20" class="font-mono" font-size="10.5" fill="#94a3b8" text-anchor="middle">R15</text>
      </g>
    </g>

    <!-- Legend Footer inside Card -->
    <g transform="translate(25, 335)">
      <!-- Hot link legend -->
      <line x1="0" y1="10" x2="22" y2="10" stroke="#f43f5e" stroke-width="4"/>
      <text x="28" y="14" class="font-sans" font-size="11" fill="#fca5a5" font-weight="600">Max Pressure Link (ρ = φ)</text>

      <!-- Adaptive path legend -->
      <line x1="205" y1="10" x2="227" y2="10" stroke="#f59e0b" stroke-width="2.5" stroke-dasharray="3 2"/>
      <text x="233" y="14" class="font-sans" font-size="11" fill="#fcd34d">Adaptive Split Path</text>

      <!-- Standard link legend -->
      <line x1="365" y1="10" x2="385" y2="10" stroke="#38bdf8" stroke-width="2"/>
      <text x="391" y="14" class="font-sans" font-size="11" fill="#94a3b8">Link (16 Gbps)</text>
    </g>
  </g>
</svg>
